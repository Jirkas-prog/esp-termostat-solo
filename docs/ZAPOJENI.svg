<text x="40" y="52" font-size="32" style="fill:#152b42" font-weight="700">ESP TERMOSTAT SOLO</text>
<text x="40" y="85" font-size="22" style="fill:#152b42" font-weight="400">T-Display • dvě sondy na 3,3 V • Wi-Fi / MQTT • upravený konektor</text>
<rect x="40" y="103" width="1240" height="42" rx="12" fill="#e1f3e7" stroke="#64a77b" stroke-width="2"/>
<text x="60" y="131" font-size="19" style="fill:#152b42" font-weight="700">FÁZE 1: režim NONE — měření a simulace, budič ani relé zatím nepřipojovat.</text>
<rect x="40" y="177" width="340" height="360" rx="12" fill="#fff" stroke="#71879c" stroke-width="2"/>
<text x="64" y="212" font-size="23" style="fill:#152b42" font-weight="700">LILYGO / TTGO T-Display</text>
<text x="64" y="240" font-size="18" style="fill:#152b42" font-weight="400">Původní ESP32, ne S3</text>
<rect x="65" y="260" width="285" height="120" rx="12" fill="#112b42" stroke="#112b42" stroke-width="2"/>
<text x="80" y="289" font-size="21" style="fill:#ffffff" font-weight="700">Vstup       Výstup</text>
<text x="80" y="316" font-size="18" style="fill:#d6efff" font-weight="400">Průměr / Min / Max / ΔT</text>
<text x="80" y="343" font-size="19" style="fill:#ffdf7d" font-weight="700">ON / OFF — SIMULACE</text>
<text x="65" y="411" font-size="18" style="fill:#152b42" font-weight="400">GPIO27 / GPIO26: 1-Wire</text>
<text x="65" y="441" font-size="18" style="fill:#152b42" font-weight="400">GPIO25 / GPIO33: IN1 / IN2</text>
<text x="65" y="480" font-size="18" style="fill:#152b42" font-weight="700">5 V vstup přes USB / 5V pin</text>
<text x="65" y="508" font-size="17" style="fill:#152b42" font-weight="400">3V3 regulátor → napájení sond</text>
<rect x="450" y="177" width="200" height="360" rx="12" fill="#eaf0f6" stroke="#71879c" stroke-width="2"/>
<text x="471" y="208" font-size="20" style="fill:#152b42" font-weight="700">KONEKTOR</text>
<text x="476" y="251" font-size="20" style="fill:#4e6070" font-weight="700">GND</text>
<circle cx="635" cy="245" r="5" fill="#4e6070"/>
